AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Frontend VPC compute: internal ALB + ECS Fargate service running the
  Next.js frontend ("Frontend target groups - Multi-AZ" in the diagram).
  Deploy after 01-vpcs and 02-transit-gateway. The ECR repo starts empty, so
  the service has 0 healthy tasks until CI/CD pushes an image — that's
  expected on first deploy. Redeploy this stack with a new pImageTag
  parameter to ship a new image (CloudFormation registers a new task
  definition revision and updates the service automatically).

Parameters:
  pNamePrefix:
    Type: String
    Default: example-react-app
  pNetworkStackName:
    Type: String
    Default: example-vpcs
  pTgwStackName:
    Type: String
    Default: example-tgw
  pSecurityVpcCidr:
    Description: Must match the Security VPC CIDR used in 01-vpcs (traffic to the internal ALB arrives via TGW from here).
    Type: String
    Default: 10.0.0.0/22
  pContainerPort:
    Description: Port the frontend container listens on (matches the Next.js Dockerfile's EXPOSE/PORT).
    Type: Number
    Default: 3000
  pImageTag:
    Description: Tag to deploy from the ECR repo this stack creates. CI/CD updates this on each deploy via --parameter-overrides.
    Type: String
    Default: latest
  pTaskCpu:
    Description: Fargate task vCPU units (256 = 0.25 vCPU).
    Type: String
    Default: "256"
  pTaskMemory:
    Description: Fargate task memory in MiB.
    Type: String
    Default: "512"
  pDesiredCount:
    Type: Number
    Default: 2
  pLogRetentionDays:
    Type: Number
    Default: 30

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB for the frontend target groups
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendVpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref pSecurityVpcCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendVpcCidr" } }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-frontend-alb-sg" }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Frontend Fargate service
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendVpcId" }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-frontend-app-sg" }

  AppSecurityGroupIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref pContainerPort
      ToPort: !Ref pContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  InternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${pNamePrefix}-frontend-alb"
      Type: application
      Scheme: internal
      Subnets:
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendAppSubnet1" }
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendAppSubnet2" }
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-frontend-alb" }

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${pNamePrefix}-frontend-tg"
      TargetType: ip
      Protocol: HTTP
      Port: !Ref pContainerPort
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendVpcId" }
      HealthCheckPath: /api/health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref AppTargetGroup }

  # --- ECS Fargate -------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${pNamePrefix}-frontend-app"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${pNamePrefix}-frontend-cluster"
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${pNamePrefix}-frontend"
      RetentionInDays: !Ref pLogRetentionDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${pNamePrefix}-frontend-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${pNamePrefix}-frontend-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${pNamePrefix}-frontend-app"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref pTaskCpu
      Memory: !Ref pTaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub "${EcrRepository.RepositoryUri}:${pImageTag}"
          Essential: true
          PortMappings:
            - { ContainerPort: !Ref pContainerPort, Protocol: tcp }
          Environment:
            - { Name: PORT, Value: !Ref pContainerPort }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: frontend

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbHttpListener
    Properties:
      ServiceName: !Sub "${pNamePrefix}-frontend-service"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref pDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendAppSubnet1" }
            - !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendAppSubnet2" }
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: !Ref pContainerPort
          TargetGroupArn: !Ref AppTargetGroup

  # Default egress for the frontend app tier routes through the TGW to the
  # Security VPC for centralized/inspected internet access.
  AppDefaultRouteViaTgw:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-FrontendAppRouteTable" }
      DestinationCidrBlock: 0.0.0.0/0
      TransitGatewayId: !ImportValue { "Fn::Sub": "${pTgwStackName}-TransitGatewayId" }

Outputs:
  InternalAlbDnsName:
    Value: !GetAtt InternalAlb.DNSName
    Export: { Name: !Sub "${AWS::StackName}-InternalAlbDnsName" }
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-EcrRepositoryUri" }
  EcrRepositoryArn:
    Value: !GetAtt EcrRepository.Arn
    Export: { Name: !Sub "${AWS::StackName}-EcrRepositoryArn" }
  EcsClusterName:
    Value: !Ref EcsCluster
    Export: { Name: !Sub "${AWS::StackName}-EcsClusterName" }
  EcsServiceArn:
    Value: !Ref EcsService
    Export: { Name: !Sub "${AWS::StackName}-EcsServiceArn" }
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-ExecutionRoleArn" }
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-TaskRoleArn" }
