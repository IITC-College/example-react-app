AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Backend VPC compute + data: internal ALB + ECS Fargate service running the
  NestJS backend, DocumentDB, RDS Oracle (Multi-AZ), and ElastiCache Redis.
  Deploy after 01-vpcs and 02-transit-gateway. The ECR repo starts empty, so
  the service has 0 healthy tasks until CI/CD pushes an image — that's
  expected on first deploy. Redeploy this stack with a new pImageTag
  parameter to ship a new image (CloudFormation registers a new task
  definition revision and updates the service automatically).

Parameters:
  pNamePrefix:
    Type: String
    Default: example-react-app
  pNetworkStackName:
    Type: String
    Default: example-vpcs
  pTgwStackName:
    Type: String
    Default: example-tgw
  pFrontendVpcCidr:
    Description: Must match the Frontend VPC CIDR used in 01-vpcs (the internal ALB is called by the frontend tier via TGW).
    Type: String
    Default: 10.1.0.0/20
  pContainerPort:
    Description: Port the backend container listens on (matches the NestJS Dockerfile's EXPOSE/PORT).
    Type: Number
    Default: 3000
  pImageTag:
    Description: Tag to deploy from the ECR repo this stack creates. CI/CD updates this on each deploy via --parameter-overrides.
    Type: String
    Default: latest
  pTaskCpu:
    Description: Fargate task vCPU units (256 = 0.25 vCPU).
    Type: String
    Default: "256"
  pTaskMemory:
    Description: Fargate task memory in MiB.
    Type: String
    Default: "512"
  pDesiredCount:
    Type: Number
    Default: 2
  pLogRetentionDays:
    Type: Number
    Default: 30
  pDocDbInstanceClass:
    Type: String
    Default: db.r6g.large
  pDocDbInstanceCount:
    Type: Number
    Default: 2
  pDocDbMasterUsername:
    Type: String
    Default: docdbadmin
  pDocDbEngineVersion:
    Type: String
    Default: "5.0.0"
  pOracleInstanceClass:
    Type: String
    Default: db.r5.large
  pOracleEngine:
    Type: String
    Default: oracle-se2
  pOracleEngineVersion:
    Description: Check `aws rds describe-db-engine-versions --engine oracle-se2` for valid values in your region.
    Type: String
    Default: "19"
  pOracleLicenseModel:
    Type: String
    Default: license-included
  pOracleAllocatedStorage:
    Type: Number
    Default: 100
  pOracleMasterUsername:
    Type: String
    Default: oracleadmin
  pRedisNodeType:
    Type: String
    Default: cache.r6g.large
  pRedisEngineVersion:
    Type: String
    Default: "7.1"
  pRedisNumCacheClusters:
    Description: 1 primary + replicas. 2 = primary + 1 replica across the two AZs.
    Type: Number
    Default: 2

Conditions:
  cCreateSecondDocDbInstance: !Equals [!Ref pDocDbInstanceCount, 2]

Resources:
  # --- App tier: internal ALB + ECS Fargate service --------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB for the backend target group
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendVpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref pFrontendVpcCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendVpcCidr" } }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-backend-alb-sg" }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend Fargate service
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendVpcId" }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-backend-app-sg" }

  AppSecurityGroupIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref pContainerPort
      ToPort: !Ref pContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DocumentDB + RDS Oracle, reachable only from the backend app tier
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendVpcId" }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-backend-db-sg" }

  DbSecurityGroupIngressDocDb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId: !Ref AppSecurityGroup

  DbSecurityGroupIngressOracle:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 1521
      ToPort: 1521
      SourceSecurityGroupId: !Ref AppSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis, reachable only from the backend app tier
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendVpcId" }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-backend-redis-sg" }

  RedisSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RedisSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref AppSecurityGroup

  InternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${pNamePrefix}-backend-alb"
      Type: application
      Scheme: internal
      Subnets:
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendAppSubnet1" }
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendAppSubnet2" }
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${pNamePrefix}-backend-alb" }

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${pNamePrefix}-backend-tg"
      TargetType: ip
      Protocol: HTTP
      Port: !Ref pContainerPort
      VpcId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendVpcId" }
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref AppTargetGroup }

  # --- ECS Fargate -------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${pNamePrefix}-backend-app"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${pNamePrefix}-backend-cluster"
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${pNamePrefix}-backend"
      RetentionInDays: !Ref pLogRetentionDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${pNamePrefix}-backend-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${pNamePrefix}-backend-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }

  # Task role gets read-only access to exactly the three secrets it needs at
  # runtime — nothing broader.
  TaskRoleSecretsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${pNamePrefix}-backend-task-secrets"
      Roles: [!Ref TaskRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref DocDbMasterSecret
              - !Ref OracleMasterSecret
              - !Ref RedisAuthSecret

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${pNamePrefix}-backend-app"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref pTaskCpu
      Memory: !Ref pTaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub "${EcrRepository.RepositoryUri}:${pImageTag}"
          Essential: true
          PortMappings:
            - { ContainerPort: !Ref pContainerPort, Protocol: tcp }
          Environment:
            - { Name: PORT, Value: !Ref pContainerPort }
            - { Name: DOCUMENTDB_ENDPOINT, Value: !GetAtt DocDbCluster.Endpoint }
            - { Name: DOCUMENTDB_SECRET_ARN, Value: !Ref DocDbMasterSecret }
            - { Name: ORACLE_ENDPOINT, Value: !GetAtt OracleDbInstance.Endpoint.Address }
            - { Name: ORACLE_SECRET_ARN, Value: !Ref OracleMasterSecret }
            - { Name: REDIS_PRIMARY_ENDPOINT, Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address }
            - { Name: REDIS_SECRET_ARN, Value: !Ref RedisAuthSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: backend

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbHttpListener
    Properties:
      ServiceName: !Sub "${pNamePrefix}-backend-service"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref pDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendAppSubnet1" }
            - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendAppSubnet2" }
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: !Ref pContainerPort
          TargetGroupArn: !Ref AppTargetGroup

  AppDefaultRouteViaTgw:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendAppRouteTable" }
      DestinationCidrBlock: 0.0.0.0/0
      TransitGatewayId: !ImportValue { "Fn::Sub": "${pTgwStackName}-TransitGatewayId" }

  # --- DocumentDB -------------------------------------------------------------
  DocDbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${pNamePrefix}-docdb-credentials"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${pDocDbMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  DocDbSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${pNamePrefix}-docdb"
      DBSubnetGroupDescription: DocumentDB subnet group
      SubnetIds:
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendDbSubnet1" }
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendDbSubnet2" }

  DocDbCluster:
    Type: AWS::DocDB::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "${pNamePrefix}-docdb"
      EngineVersion: !Ref pDocDbEngineVersion
      MasterUsername: !Sub "{{resolve:secretsmanager:${DocDbMasterSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DocDbMasterSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DocDbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true

  DocDbInstance1:
    Type: AWS::DocDB::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${pNamePrefix}-docdb-0"
      DBClusterIdentifier: !Ref DocDbCluster
      DBInstanceClass: !Ref pDocDbInstanceClass

  DocDbInstance2:
    Type: AWS::DocDB::DBInstance
    Condition: cCreateSecondDocDbInstance
    Properties:
      DBInstanceIdentifier: !Sub "${pNamePrefix}-docdb-1"
      DBClusterIdentifier: !Ref DocDbCluster
      DBInstanceClass: !Ref pDocDbInstanceClass

  # --- RDS Oracle (Multi-AZ) ---------------------------------------------------
  OracleMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${pNamePrefix}-oracle-credentials"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${pOracleMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  OracleDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS Oracle subnet group
      SubnetIds:
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendDbSubnet1" }
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendDbSubnet2" }

  OracleDbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${pNamePrefix}-oracle"
      Engine: !Ref pOracleEngine
      EngineVersion: !Ref pOracleEngineVersion
      LicenseModel: !Ref pOracleLicenseModel
      DBInstanceClass: !Ref pOracleInstanceClass
      AllocatedStorage: !Ref pOracleAllocatedStorage
      StorageEncrypted: true
      MultiAZ: true
      MasterUsername: !Sub "{{resolve:secretsmanager:${OracleMasterSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${OracleMasterSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref OracleDbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]

  # --- ElastiCache Redis (replication group, Multi-AZ automatic failover) -----
  RedisAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${pNamePrefix}-redis-credentials"
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: auth_token
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub "${pNamePrefix}-redis"
      Description: ElastiCache Redis subnet group
      SubnetIds:
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendDbSubnet1" }
        - !ImportValue { "Fn::Sub": "${pNetworkStackName}-BackendDbSubnet2" }

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "${pNamePrefix}-redis"
      ReplicationGroupDescription: !Sub "${pNamePrefix} Redis cache (Multi-AZ, automatic failover)"
      Engine: redis
      EngineVersion: !Ref pRedisEngineVersion
      CacheNodeType: !Ref pRedisNodeType
      Port: 6379
      NumCacheClusters: !Ref pRedisNumCacheClusters
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds: [!Ref RedisSecurityGroup]
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      AuthToken: !Sub "{{resolve:secretsmanager:${RedisAuthSecret}:SecretString:auth_token}}"

Outputs:
  InternalAlbDnsName:
    Value: !GetAtt InternalAlb.DNSName
    Export: { Name: !Sub "${AWS::StackName}-InternalAlbDnsName" }
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-EcrRepositoryUri" }
  EcrRepositoryArn:
    Value: !GetAtt EcrRepository.Arn
    Export: { Name: !Sub "${AWS::StackName}-EcrRepositoryArn" }
  EcsClusterName:
    Value: !Ref EcsCluster
    Export: { Name: !Sub "${AWS::StackName}-EcsClusterName" }
  EcsServiceArn:
    Value: !Ref EcsService
    Export: { Name: !Sub "${AWS::StackName}-EcsServiceArn" }
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-ExecutionRoleArn" }
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-TaskRoleArn" }
  DocDbClusterEndpoint:
    Value: !GetAtt DocDbCluster.Endpoint
  OracleEndpoint:
    Value: !GetAtt OracleDbInstance.Endpoint.Address
  RedisPrimaryEndpoint:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  RedisReaderEndpoint:
    Value: !GetAtt RedisReplicationGroup.ReaderEndPoint.Address
